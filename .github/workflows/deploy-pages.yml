name: Deploy a GitHub Pages

# RONDA — Deploy público exclusivamente desde GitHub.
# Cada push a main compila el export estático y lo publica en:
#   https://sebasm2kuy.github.io/ronda/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build estático
    runs-on: ubuntu-latest
    env:
      NEXT_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /ronda
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Build de export estático
        run: bun run build

      - name: Verificar salida
        run: |
          # Pages de proyecto sirve el artefacto bajo /ronda/ → el basePath
          # ya queda implícito en la URL: el artefacto es out/ directamente.
          test -f out/index.html || { echo "Falta out/index.html"; exit 1; }
          test -d out/_next || { echo "Faltan assets _next"; exit 1; }
          grep -q '/ronda/_next' out/registro/index.html || { echo "Los assets no usan el basePath /ronda"; exit 1; }
          echo "✓ Export OK: $(find out -name '*.html' | wc -l) HTML, assets con basePath /ronda"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar en Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
